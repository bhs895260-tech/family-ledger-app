<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직거래 매물</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/market.css">
</head>
<body>
  <div id="nav"></div>
  <h1>직거래 매물</h1>
  <p class="sub">점주가 직접 올리고 직접 응대하는 공개 매물입니다. 수수료 없이 바로 연락하세요.</p>

  <div class="chips" id="price">
    <button class="chip on" data-max="">전체</button>
    <button class="chip" data-max="5000">5천 이하</button>
    <button class="chip" data-max="10000">1억 이하</button>
  </div>
  <div class="filters">
    <select id="sido"></select>
    <select id="category"></select>
    <input type="text" id="sigungu" placeholder="시/군/구" style="flex:1;min-width:110px">
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="card info" style="margin-top:16px">
    <b>원하는 매물이 없나요?</b>
    <p class="hint" style="margin:4px 0 10px">조건 등록해두면 맞는 매물 올라올 때 알려드립니다.</p>
    <a class="btn small" href="buy.html">조건 등록하기</a>
  </div>

<script type="module">
  import { mountNav, $, $$, fillRegion, fillCategory, listingCard, esc } from './js/ui.js';
  import { filterDirect } from './js/domain.js';
  import { allListings } from './js/store.js';

  mountNav('direct.html');
  fillRegion($('#sido'), '지역 전체'); fillCategory($('#category'), '업종 전체');
  let maxPrice = null;

  function render() {
    const rows = filterDirect(allListings(), {
      maxPrice, sido: $('#sido').value, category: $('#category').value, sigungu: $('#sigungu').value.trim(),
    });
    $('#count').textContent = `${rows.length}건`;
    $('#list').innerHTML = rows.length
      ? rows.map((l) => listingCard(l, `<div class="btnrow"><a class="btn small" href="tel:${esc(l.contact)}">점주에게 직접 연락</a></div>`)).join('')
      : '<div class="card empty">조건에 맞는 직거래 매물이 없습니다.</div>';
  }
  $$('#price .chip').forEach((c) => c.onclick = () => {
    $$('#price .chip').forEach((x) => x.classList.remove('on'));
    c.classList.add('on');
    maxPrice = c.dataset.max ? Number(c.dataset.max) : null;
    render();
  });
  ['#sido', '#category'].forEach((s) => $(s).onchange = render);
  $('#sigungu').oninput = render;
  render();
</script>
</body>
</html>
